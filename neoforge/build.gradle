plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version "${moddevgradle_version}"
}

apply from: '../gradle-common.gradle'

version = "${mod_version}+mc${grProps.mc_label}"
group = mod_group

base {
    archivesName = "giant_refresh-neoforge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(grProps.java_version as int)

sourceSets.main.java.srcDirs = ["${grGen}/common/java", "${grGen}/neoforge/java"]
sourceSets.main.resources.srcDirs = ["${grGen}/common/resources", "${grGen}/neoforge/resources"]

neoForge {
    version = grProps.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : grProps.minecraft_version,
            minecraft_version_range: grProps.neo_mc_range,
            neo_version            : grProps.neo_min,
            mod_id                 : mod_id,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "${grGen}/neoforge/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
