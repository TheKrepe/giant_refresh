modLoader="javafml"
loaderVersion="[1,)"
license="All Rights Reserved"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="Giant Refresh"
authors="Star_1mp"
logoFile="assets/giant_refresh/icon.png"
description='''
Turns the forgotten Giant into a real inhabitant of the world: a rare, huge and dangerous mob with telegraphed attacks, a harness hat carrying hostile riders, footprint trails, sleeping Giants and the Potion of Growth.
'''

[[mixins]]
config="giant_refresh.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
