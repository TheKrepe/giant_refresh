name: probe
on:
  push:
    branches: [probe]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Run probe
        run: bash tools/probe.sh
      - name: Commit results
        run: |
          git config user.name "probe-bot"
          git config user.email "probe-bot@users.noreply.github.com"
          git add -A out2
          git commit -m "probe results [skip ci]" || true
          git push origin HEAD:probe-results2 --force
