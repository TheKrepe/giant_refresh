name: Compile all versions
on:
  push:
    branches: [multiversion]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    strategy:
      fail-fast: false
      matrix:
        target: ['26.3', '26.2', '26.1', '1.21.11', '1.21.9', '1.21.6']
        loader: [fabric, neoforge]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'
      - name: Compile
        run: |
          DIR=${{ matrix.loader }}
          if [ "$DIR" = fabric ]; then DIR=$(grep '^fabric_build=' versions/${{ matrix.target }}.properties | cut -d= -f2); fi
          cd $DIR
          gradle build -x test --no-daemon -q -Pgr_target=${{ matrix.target }} > ../compile.log 2>&1; rc=$?
          grep -E "error:|warning: \[removal\]|FAILURE|What went wrong|Could not|Exception" -A3 ../compile.log | head -400
          echo "== tail"; tail -40 ../compile.log
          ls -la build/libs 2>/dev/null
          exit $rc
