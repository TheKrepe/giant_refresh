name: Trailer audio assets + music

on:
  push:
    branches: [trailer-post]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'
      - name: Vanilla assets
        working-directory: fabric
        run: |
          gradle downloadAssets --no-daemon -Pgr_target=26.2 -q || true
          find ~/.gradle -path '*assets*' -name '*.json' -path '*indexes*' | head -5
      - name: Collect sounds
        run: |
          git clone -q --depth 1 --branch trailer-out "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" out
          python3 - <<'PY'
          import json, glob, os, shutil, re
          idx = sorted(glob.glob(os.path.expanduser('~/.gradle/**/assets/indexes/*.json'), recursive=True), key=os.path.getmtime)[-1]
          objs = os.path.join(os.path.dirname(os.path.dirname(idx)), 'objects')
          index = json.load(open(idx))['objects']
          want = set()
          for f in glob.glob('out/shots/*.sounds.jsonl'):
              for line in open(f):
                  try:
                      d = json.loads(line)
                  except Exception:
                      continue
                  ns, path = d['file'].split(':', 1)
                  want.add(path)
          for extra in open('trailer/sfx_extra.txt').read().split():
              want.add(extra)
          os.makedirs('out/audio/sfx', exist_ok=True)
          n = 0
          for p in sorted(want):
              key = f'minecraft/sounds/{p}.ogg'
              if key not in index:
                  print('missing', key); continue
              h = index[key]['hash']
              dst = 'out/audio/sfx/' + p.replace('/', '__') + '.ogg'
              shutil.copy(os.path.join(objs, h[:2], h), dst); n += 1
          print('copied', n, 'from', idx)
          PY
      - name: Music
        run: |
          sudo apt-get update -qq >/dev/null; sudo apt-get install -y -qq fluidsynth ffmpeg >/dev/null
          curl -fsSL -o sf.sf3 https://ftp.osuosl.org/pub/musescore/soundfont/MuseScore_General/MuseScore_General.sf3 || curl -fsSL -o sf.sf3 https://github.com/musescore/MuseScore/raw/2.3.2/share/sound/FluidR3Mono_GM.sf3
          ls -la sf.sf3
          python3 trailer/music.py trailer/cues.json music.mid
          fluidsynth -ni -g 0.6 -r 48000 -R 1 -C 1 -F music.wav sf.sf3 music.mid
          ffmpeg -y -loglevel error -i music.wav -c:a flac out/audio/music.flac
          cp music.mid out/audio/music.mid
      - name: Publish
        run: |
          cd out; git config user.name ci; git config user.email ci@localhost
          git add -A; git commit -qm "audio ${{ github.run_id }}" || exit 0
          for i in $(seq 1 20); do git push -q origin trailer-out && break; sleep 5; git fetch -q origin trailer-out && git rebase -q origin/trailer-out || git rebase --abort; done
