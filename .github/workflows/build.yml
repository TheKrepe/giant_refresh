name: Build

on:
  push:
    branches: [main, multiversion]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check loader / toolchain versions for every target
        run: python3 .github/scripts/check_versions.py | tee versions.txt
      - name: Summary
        run: |
          echo '### Loader versions' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY; cat versions.txt >> $GITHUB_STEP_SUMMARY; echo '```' >> $GITHUB_STEP_SUMMARY

  # ------------------------------------------------------------------ one archive per Minecraft range
  build:
    strategy:
      fail-fast: false
      matrix:
        target: ['26.3', '26.2', '26.1', '1.21.11', '1.21.9', '1.21.6']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Target info
        id: meta
        run: |
          P=versions/${{ matrix.target }}.properties
          prop() { grep "^$1=" $P | cut -d= -f2-; }
          MODV=$(grep '^mod_version=' fabric/gradle.properties | cut -d= -f2)
          echo "fabric_dir=$(prop fabric_build)" >> $GITHUB_OUTPUT
          echo "java=$(prop java_version)" >> $GITHUB_OUTPUT
          echo "name=giant_refresh-$MODV-mc$(prop mc_label)" >> $GITHUB_OUTPUT

      - name: Build Fabric
        id: fabric
        continue-on-error: true
        working-directory: ${{ steps.meta.outputs.fabric_dir }}
        run: gradle build -x test --no-daemon -Pgr_target=${{ matrix.target }}

      - name: Build NeoForge
        id: neoforge
        continue-on-error: true
        working-directory: neoforge
        run: gradle build -x test --no-daemon -Pgr_target=${{ matrix.target }}

      - name: Collect jars
        run: |
          mkdir -p dist
          find ${{ steps.meta.outputs.fabric_dir }}/build/libs neoforge/build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' -exec cp {} dist/ \; 2>/dev/null || true
          ls -la dist

      - name: Upload archive (Fabric + NeoForge)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.name }}
          path: dist/*.jar
          if-no-files-found: error

      # dev-environment server run (makes the world for the render test)
      - name: Smoke test Fabric server (dev)
        id: fabric_smoke
        if: steps.fabric.outcome == 'success'
        continue-on-error: true
        working-directory: ${{ steps.meta.outputs.fabric_dir }}
        env:
          JAVA_TOOL_OPTIONS: -Dgiantrefresh.smoketest=true
        run: |
          mkdir -p run; echo "eula=true" > run/eula.txt
          printf "level-seed=giantrefresh\nview-distance=5\nsimulation-distance=5\nspawn-protection=0\nonline-mode=false\nsync-chunk-writes=false\n" > run/server.properties
          timeout 1200 gradle runServer --no-daemon -Pgr_target=${{ matrix.target }} > server.log 2>&1 || true
          grep -E "\[SMOKETEST\]|Mixin|mixin|ERROR|Exception|Caused by" server.log | grep -vE "JAVA_TOOL_OPTIONS" | head -200 || true
          grep -q "SMOKETEST.*-> PASS" server.log

      - name: Render test (Fabric client, software GL)
        id: client_render
        if: steps.fabric_smoke.outcome == 'success'
        continue-on-error: true
        working-directory: ${{ steps.meta.outputs.fabric_dir }}
        env:
          JAVA_TOOL_OPTIONS: -Dgiantrefresh.clientsmoketest=true
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq xvfb mesa-vulkan-drivers libgl1-mesa-dri imagemagick >/dev/null
          mkdir -p run/saves
          cp -r run/world run/saves/smoke
          rm -f run/saves/smoke/session.lock
          printf "onboardAccessibility:false\nskipMultiplayerWarning:true\ntutorialStep:none\njoinedFirstServer:true\nrenderDistance:6\npauseOnLostFocus:false\nnarrator:0\nsoundCategory_master:0.0\n" > run/options.txt
          timeout 1200 xvfb-run -a -s "-screen 0 1280x720x24" gradle runClient --no-daemon -Pgr_target=${{ matrix.target }} --args="--quickPlaySingleplayer smoke" > client.log 2>&1 || true
          grep -E "CLIENTTEST|ERROR|Exception|Caused by|Mixin|mixin" client.log | grep -v JAVA_TOOL_OPTIONS | head -80 || true
          echo "== graphics"; grep -iE "opengl|llvmpipe|vulkan|backend|GLX|GL_|renderer|gpu|framebuffer" client.log | grep -v JAVA_TOOL_OPTIONS | head -30 || true
          echo "== warnings"; grep -E "/WARN\]" client.log | cut -c1-250 | sort | uniq -c | sort -rn | head -30 || true
          for f in run/screenshots/*.png; do
            [ -f "$f" ] || continue
            convert "$f" -resize 1024x -quality 80 "$f.jpg"
            echo "IMG_BEGIN $f"; base64 -w0 "$f.jpg"; echo; echo "IMG_END"
          done
          ls run/screenshots/giant_test_*.png

      - name: Fail if a build or test failed
        if: steps.fabric.outcome != 'success' || steps.neoforge.outcome != 'success' || steps.fabric_smoke.outcome != 'success' || steps.client_render.outcome != 'success'
        run: |
          echo "build fabric=${{ steps.fabric.outcome }} neoforge=${{ steps.neoforge.outcome }}"
          echo "dev smoke=${{ steps.fabric_smoke.outcome }} render=${{ steps.client_render.outcome }}"
          exit 1

  # ------------------------------------------------------------------ real servers, every patch version
  prod:
    needs: build
    if: always()
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: '26.3',    mc: '26.3',    java: '25' }
          - { target: '26.2',    mc: '26.2',    java: '25' }
          - { target: '26.1',    mc: '26.1',    java: '25' }
          - { target: '26.1',    mc: '26.1.1',  java: '25' }
          - { target: '26.1',    mc: '26.1.2',  java: '25' }
          - { target: '1.21.11', mc: '1.21.11', java: '21' }
          - { target: '1.21.9',  mc: '1.21.9',  java: '21' }
          - { target: '1.21.9',  mc: '1.21.10', java: '21' }
          - { target: '1.21.6',  mc: '1.21.6',  java: '21' }
          - { target: '1.21.6',  mc: '1.21.7',  java: '21' }
          - { target: '1.21.6',  mc: '1.21.8',  java: '21' }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Archive name
        id: meta
        run: |
          P=versions/${{ matrix.target }}.properties
          MODV=$(grep '^mod_version=' fabric/gradle.properties | cut -d= -f2)
          echo "name=giant_refresh-$MODV-mc$(grep '^mc_label=' $P | cut -d= -f2-)" >> $GITHUB_OUTPUT
      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.meta.outputs.name }}
          path: jars
      - name: Fabric server ${{ matrix.mc }}
        id: fabric
        continue-on-error: true
        run: bash .github/scripts/prod_test.sh fabric ${{ matrix.mc }} $(ls jars/giant_refresh-fabric-*.jar)
      - name: NeoForge server ${{ matrix.mc }}
        id: neoforge
        continue-on-error: true
        run: bash .github/scripts/prod_test.sh neoforge ${{ matrix.mc }} $(ls jars/giant_refresh-neoforge-*.jar)
      - name: Result
        run: |
          echo "| ${{ matrix.mc }} | Fabric: ${{ steps.fabric.outcome }} | NeoForge: ${{ steps.neoforge.outcome }} |" >> $GITHUB_STEP_SUMMARY
          [ "${{ steps.fabric.outcome }}" = success ] && [ "${{ steps.neoforge.outcome }}" = success ]
