name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Build Fabric
        id: fabric
        continue-on-error: true
        working-directory: fabric
        run: gradle build --stacktrace --no-daemon

      - name: Build NeoForge
        id: neoforge
        continue-on-error: true
        working-directory: neoforge
        run: gradle build --stacktrace --no-daemon

      - name: Collect jars
        run: |
          mkdir -p dist
          find fabric/build/libs neoforge/build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' -exec cp {} dist/ \; 2>/dev/null || true
          ls -la dist

      - name: Upload mod jars (Fabric + NeoForge)
        uses: actions/upload-artifact@v4
        with:
          name: giant_refresh-${{ github.run_number }}
          path: dist/*.jar
          if-no-files-found: warn

      # ---------------------------------------------------------------- dedicated-server smoke tests
      - name: Prepare server run dirs
        run: |
          for d in fabric/run neoforge/run; do
            mkdir -p $d
            echo "eula=true" > $d/eula.txt
            printf "level-seed=giantrefresh\nview-distance=5\nsimulation-distance=5\nspawn-protection=0\nonline-mode=false\nsync-chunk-writes=false\n" > $d/server.properties
          done

      - name: Smoke test Fabric server
        id: fabric_smoke
        if: steps.fabric.outcome == 'success'
        continue-on-error: true
        working-directory: fabric
        env:
          JAVA_TOOL_OPTIONS: -Dgiantrefresh.smoketest=true
        run: |
          timeout 1200 gradle runServer --no-daemon > server.log 2>&1 || true
          grep -E "SMOKETEST|Mixin|mixin|ERROR|Exception|Caused by" server.log | grep -vE "JAVA_TOOL_OPTIONS" | head -80 || true
          grep -q "SMOKETEST.*PASS" server.log

      - name: Smoke test NeoForge server
        id: neoforge_smoke
        if: steps.neoforge.outcome == 'success'
        continue-on-error: true
        working-directory: neoforge
        env:
          JAVA_TOOL_OPTIONS: -Dgiantrefresh.smoketest=true
        run: |
          timeout 1200 gradle runServer --no-daemon > server.log 2>&1 || true
          grep -E "SMOKETEST|Mixin|mixin|ERROR|Exception|Caused by" server.log | grep -vE "JAVA_TOOL_OPTIONS" | head -80 || true
          grep -q "SMOKETEST.*PASS" server.log

      - name: Render test (Fabric client, software GL)
        id: client_render
        if: steps.fabric_smoke.outcome == 'success'
        continue-on-error: true
        working-directory: fabric
        env:
          JAVA_TOOL_OPTIONS: -Dgiantrefresh.clientsmoketest=true
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq xvfb mesa-vulkan-drivers libgl1-mesa-dri imagemagick >/dev/null
          mkdir -p run/saves
          cp -r run/world run/saves/smoke
          rm -f run/saves/smoke/session.lock
          printf "onboardAccessibility:false\nskipMultiplayerWarning:true\ntutorialStep:none\njoinedFirstServer:true\nrenderDistance:6\npauseOnLostFocus:false\nnarrator:0\nsoundCategory_master:0.0\n" > run/options.txt
          timeout 1200 xvfb-run -a -s "-screen 0 1280x720x24" gradle runClient --no-daemon --args="--quickPlaySingleplayer smoke" > client.log 2>&1 || true
          grep -E "CLIENTTEST|ERROR|Exception|Caused by|Mixin|mixin" client.log | grep -v JAVA_TOOL_OPTIONS | head -80 || true
          ls -la run/screenshots || true
          for f in run/screenshots/giant_test_*.png; do
            [ -f "$f" ] || continue
            convert "$f" -resize 1024x -quality 80 "$f.jpg"
            echo "IMG_BEGIN $f"; base64 -w0 "$f.jpg"; echo; echo "IMG_END"
          done
          ls run/screenshots/giant_test_*.png

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs-${{ github.run_number }}
          path: |
            fabric/server.log
            neoforge/server.log
            fabric/client.log
          if-no-files-found: ignore

      - name: Fail if a build or smoke test failed
        if: steps.fabric.outcome != 'success' || steps.neoforge.outcome != 'success' || steps.fabric_smoke.outcome != 'success' || steps.neoforge_smoke.outcome != 'success'
        run: |
          echo "Fabric build: ${{ steps.fabric.outcome }}  NeoForge build: ${{ steps.neoforge.outcome }}"
          echo "Fabric smoke: ${{ steps.fabric_smoke.outcome }}  NeoForge smoke: ${{ steps.neoforge_smoke.outcome }}"
          exit 1
