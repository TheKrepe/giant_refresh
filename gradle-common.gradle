// Shared by fabric/, fabric-remap/ and neoforge/: picks the target Minecraft version
// (-Pgr_target=<versions/*.properties name>, default 26.3) and runs the source preprocessor.
def target = (findProperty('gr_target') ?: '26.3').toString()
def tp = new Properties()
file("${rootDir}/../versions/${target}.properties").withInputStream { tp.load(it) }
ext.grTarget = target
ext.grProps = tp
ext.grGen = file("${rootDir}/../build/gen/${target}")

def preprocess = tasks.register('grPreprocess', Exec) {
    workingDir "${rootDir}/.."
    commandLine 'python3', 'tools/preprocess.py', target
    outputs.upToDateWhen { false }
}
tasks.matching { it.name in ['compileJava', 'processResources', 'generateModMetadata', 'sourcesJar'] }.configureEach {
    dependsOn preprocess
}
